[tool.poetry]
name = "synthetic"
version = "0.1.0"
description = ""
authors = ["Martin Finn-Sell"]
packages = [{include = "nogan_synth", from = "src"}]

[tool.poetry.dependencies]
python =  ">=3.11,<3.13"
tqdm = "*"         # Same for all
typer = {extras = ["all"], version = "^0.9.0"}  # Same for all
python-dotenv = "^1.0.0" # Same for all
dataset = "^1.6.2"           # Same for all
pytest = "^7.4.2"            # Optional: if needed for testing
pytest-cov = "^4.1.0"        # Optional: if needed for testing
pytest-mock = "^3.12.0"      # Optional: if needed for testing
black = "^23.12.1"
retrying = "^1.3.4"
isort = "^5.12.0"
jupyter = "^1.1.1"
pandas = "^2.2.3"
networkx = "^3.4.2"
scipy = "^1.15.3"
scikit-learn = "^1.6.1"
seaborn = "^0.13.2"
tensorflow = "<=2.13"
keras = "<=3"
umap-learn = "0.5.4"
mostlyai-qa = "^1.9.6"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100  # Should be the same as Black's line length